{
"name": "Build WhatNow APK",
"on": {
"push": {
"branches": ["main", "master"]
},
"workflow_dispatch": {}
},
"jobs": {
"build": {
"runs-on": "ubuntu-latest",
"steps": [
{
"name": "Code auschecken",
"uses": "actions/checkout@v4"
},
{
"name": "Java 17 einrichten",
"uses": "actions/setup-java@v4",
"with": {
"distribution": "temurin",
"java-version": "17"
}
},
{
"name": "Gradle 8.9 installieren",
"uses": "gradle/actions/setup-gradle@v4",
"with": {
"gradle-version": "8.9"
}
},
{
"name": "Debug-APK kompilieren",
"run": "gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon"
},
{
"name": "Fertige APK bereitstellen",
"uses": "actions/upload-artifact@v4",
"with": {
"name": "WhatNow-App-APK",
"path": "app/build/outputs/apk/debug/app-debug.apk"
}
}
]
}
}
}
